name: SpinMin
options:
  bundleIdPrefix: com.spinmin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "8XGDTANS45"

packages:
  MinAppKit:
    path: ../../packages/design-system/swift

targets:
  SpinMin:
    type: application
    platform: iOS
    sources:
      - path: SpinMin
      - path: Shared
    dependencies:
      - package: MinAppKit
      - target: SpinMinWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Carambula-Projects.SpinMin
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: SpinMin/Info.plist
    info:
      path: SpinMin/Info.plist
    entitlements:
      path: SpinMin.entitlements

  SpinMinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SpinMinWidget
      - path: Shared
    entitlements:
      path: SpinMinWidget/SpinMinWidget.entitlements
    info:
      path: SpinMinWidget/Info.plist
      properties:
        CFBundleDisplayName: SpinMin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Carambula-Projects.SpinMin.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1

  SpinMinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpinMinTests
    dependencies:
      - target: SpinMin

schemes:
  SpinMin:
    build:
      targets:
        SpinMin: all
        SpinMinTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpinMinTests

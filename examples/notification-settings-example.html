<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Settings Example - Min Apps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f5f5f7;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1d1d1f;
    }

    .subtitle {
      font-size: 16px;
      color: #6e6e73;
      margin-bottom: 32px;
    }

    .app-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .app-button {
      padding: 10px 20px;
      border: 1px solid #d2d2d7;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .app-button:hover {
      background: #f5f5f7;
    }

    .app-button.active {
      background: #0071e3;
      color: white;
      border-color: #0071e3;
    }

    .settings-group {
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-header {
      padding: 16px;
      background: white;
      border-bottom: 1px solid #d2d2d7;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .settings-header:hover {
      background: #f5f5f7;
    }

    .settings-header h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .settings-header p {
      font-size: 14px;
      color: #6e6e73;
    }

    .settings-content {
      padding: 16px;
      display: none;
    }

    .settings-content.active {
      display: block;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f7;
    }

    .toggle-container:last-child {
      border-bottom: none;
    }

    .toggle-label {
      flex: 1;
    }

    .toggle-label strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .toggle-label span {
      display: block;
      font-size: 14px;
      color: #6e6e73;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
      background: #d2d2d7;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch.active {
      background: #0071e3;
    }

    .toggle-switch.active::after {
      transform: translateX(20px);
    }

    .input-group {
      margin: 16px 0;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #0071e3;
    }

    .additional-settings {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f5f5f7;
    }

    .info-box {
      background: #f5f5f7;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      color: #6e6e73;
    }

    .chevron {
      transition: transform 0.2s;
    }

    .chevron.active {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Notification Settings</h1>
    <p class="subtitle">Manage your notification preferences for min apps</p>

    <div class="app-selector">
      <button class="app-button active" data-app="cyclismo">Cyclismo Guide</button>
      <button class="app-button" data-app="podlink">podlink</button>
      <button class="app-button" data-app="watchedit">WatchedIt</button>
      <button class="app-button" data-app="yourtube">yourtube</button>
    </div>

    <div id="settings-container"></div>
  </div>

  <script type="module">
    const apps = {
      cyclismo: {
        name: 'Cyclismo Guide',
        settings: [
          {
            id: 'morning_races',
            title: 'Morning Race Notification',
            description: 'Get notified in the morning if there are races today',
            enabled: false,
            fields: [
              { type: 'time', label: 'Notification time', value: '08:00' }
            ],
            info: 'Receive a summary of today\'s races, times, and streamers'
          },
          {
            id: 'recap',
            title: 'Recap Notification',
            description: 'Get a recap after races conclude',
            enabled: false,
            fields: [
              { type: 'number', label: 'Hours after last race', value: 3, min: 1, max: 12, suffix: 'hours' }
            ],
            info: 'Receive podcasts and replays after the last race'
          },
          {
            id: 'stream_start',
            title: 'Stream Start Notifications',
            description: 'Get notified before races start streaming',
            enabled: false,
            fields: [
              { type: 'number', label: 'Notify before stream', value: 5, min: 5, max: 60, suffix: 'minutes' },
              { type: 'toggle', label: 'Only saved races', value: false }
            ]
          }
        ]
      },
      podlink: {
        name: 'podlink',
        settings: [
          {
            id: 'morning_queue',
            title: 'Morning Queue Summary',
            description: 'Get a daily summary of your podcast queue',
            enabled: false,
            fields: [
              { type: 'time', label: 'Notification time', value: '08:00' },
              { type: 'toggle', label: 'Use Apple Intelligence', value: true, description: 'Generate smart summaries' }
            ]
          },
          {
            id: 'priority_podcasts',
            title: 'Priority Podcasts',
            description: 'Get notified when specific podcasts have new episodes',
            enabled: false,
            fields: [
              { type: 'number', label: 'Check interval', value: 60, min: 15, max: 360, suffix: 'minutes' }
            ],
            info: '0 priority podcasts selected. Manage in the podcasts tab.'
          }
        ]
      },
      watchedit: {
        name: 'WatchedIt',
        settings: [
          {
            id: 'new_episodes',
            title: 'New Episodes',
            description: 'Get notified about new podcast episodes',
            enabled: false,
            fields: [
              { type: 'time', label: 'Check time', value: '09:00' }
            ],
            info: 'Check daily for new episodes from your podcasts'
          }
        ]
      },
      yourtube: {
        name: 'yourtube',
        settings: [
          {
            id: 'morning_queue',
            title: 'Morning Queue Summary',
            description: 'Get a daily summary of your video queue',
            enabled: false,
            fields: [
              { type: 'time', label: 'Notification time', value: '08:00' },
              { type: 'toggle', label: 'Use Apple Intelligence', value: true, description: 'Generate smart summaries' }
            ]
          },
          {
            id: 'priority_channels',
            title: 'Priority Channels',
            description: 'Get notified when specific channels upload new videos',
            enabled: false,
            fields: [
              { type: 'number', label: 'Check interval', value: 60, min: 15, max: 360, suffix: 'minutes' }
            ],
            info: '0 priority channels selected. Manage in the channels tab.'
          }
        ]
      }
    };

    let currentApp = 'cyclismo';

    function renderSettings() {
      const container = document.getElementById('settings-container');
      const appData = apps[currentApp];
      
      container.innerHTML = appData.settings.map((setting, idx) => `
        <div class="settings-group">
          <div class="settings-header" onclick="toggleGroup(${idx})">
            <div>
              <h3>${setting.title}</h3>
              <p>${setting.description}</p>
            </div>
            <svg class="chevron" id="chevron-${idx}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="settings-content" id="content-${idx}">
            <div class="toggle-container">
              <div class="toggle-label">
                <strong>Enable notifications</strong>
                <span>${setting.description}</span>
              </div>
              <div class="toggle-switch ${setting.enabled ? 'active' : ''}" 
                   onclick="toggleSetting(${idx})" 
                   id="toggle-${idx}"></div>
            </div>
            ${setting.enabled ? `
              <div class="additional-settings" id="additional-${idx}">
                ${setting.fields.map((field, fieldIdx) => {
                  if (field.type === 'time') {
                    return `
                      <div class="input-group">
                        <label>${field.label}</label>
                        <input type="time" value="${field.value}">
                      </div>
                    `;
                  } else if (field.type === 'number') {
                    return `
                      <div class="input-group">
                        <label>${field.label}</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <input type="number" value="${field.value}" min="${field.min}" max="${field.max}" style="flex: 1;">
                          ${field.suffix ? `<span style="color: #6e6e73;">${field.suffix}</span>` : ''}
                        </div>
                      </div>
                    `;
                  } else if (field.type === 'toggle') {
                    return `
                      <div class="toggle-container">
                        <div class="toggle-label">
                          <strong>${field.label}</strong>
                          ${field.description ? `<span>${field.description}</span>` : ''}
                        </div>
                        <div class="toggle-switch ${field.value ? 'active' : ''}" 
                             onclick="toggleSubSetting(${idx}, ${fieldIdx})"></div>
                      </div>
                    `;
                  }
                }).join('')}
                ${setting.info ? `<div class="info-box">${setting.info}</div>` : ''}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    window.toggleGroup = function(idx) {
      const content = document.getElementById(`content-${idx}`);
      const chevron = document.getElementById(`chevron-${idx}`);
      content.classList.toggle('active');
      chevron.classList.toggle('active');
    };

    window.toggleSetting = function(idx) {
      const toggle = document.getElementById(`toggle-${idx}`);
      const setting = apps[currentApp].settings[idx];
      setting.enabled = !setting.enabled;
      toggle.classList.toggle('active');
      renderSettings();
    };

    window.toggleSubSetting = function(settingIdx, fieldIdx) {
      const setting = apps[currentApp].settings[settingIdx];
      setting.fields[fieldIdx].value = !setting.fields[fieldIdx].value;
      renderSettings();
    };

    document.querySelectorAll('.app-button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.app-button').forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        currentApp = button.dataset.app;
        renderSettings();
      });
    });

    renderSettings();
  </script>
</body>
</html>

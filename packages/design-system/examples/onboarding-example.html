<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Apps Onboarding Example</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --color-primary: #007AFF;
      --color-primary-dark: #0051D5;
      --color-background: #F2F2F7;
      --color-surface: #FFFFFF;
      --color-surface-hover: #F9F9F9;
      --color-border: #E5E5EA;
      --color-text-primary: #000000;
      --color-text-secondary: #6C6C70;
      --color-text-on-primary: #FFFFFF;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .demo-header h1 {
      font-size: 36px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 12px;
    }

    .demo-header p {
      font-size: 18px;
      color: var(--color-text-secondary);
    }

    .demo-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .demo-button {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-button:hover {
      background: var(--color-surface-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .demo-button--primary {
      background: var(--color-primary);
      color: var(--color-text-on-primary);
      border-color: var(--color-primary);
    }

    .demo-button--primary:hover {
      background: var(--color-primary-dark);
    }

    .demo-status {
      text-align: center;
      padding: 16px;
      background: var(--color-surface);
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .demo-app-view {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    #root {
      min-height: 60vh;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>Min Apps Onboarding Flow</h1>
      <p>Interactive example of the onboarding system with notification preferences</p>
    </div>

    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const APP_IDS = {
      CYCLISMO: 'cyclismo',
      PODLINK: 'podlink',
      WATCHEDIT: 'watchedit',
      YOURTUBE: 'yourtube'
    };

    function OnboardingDemo() {
      const [selectedApp, setSelectedApp] = useState(APP_IDS.CYCLISMO);
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [currentStep, setCurrentStep] = useState(0);
      const [isComplete, setIsComplete] = useState(false);

      const apps = [
        { id: APP_IDS.CYCLISMO, name: 'Cyclismo Guide', icon: '🚴' },
        { id: APP_IDS.PODLINK, name: 'podlink', icon: '🎙️' },
        { id: APP_IDS.WATCHEDIT, name: 'WatchedIt', icon: '🎬' },
        { id: APP_IDS.YOURTUBE, name: 'yourtube', icon: '📺' }
      ];

      const getSteps = (appId) => {
        const appInfo = apps.find(a => a.id === appId);
        return [
          {
            title: `Welcome to ${appInfo.name}`,
            description: 'Let\'s get you started with the basics.',
            icon: appInfo.icon
          },
          {
            title: 'Key Features',
            description: 'Here\'s what you can do with this app.',
            icon: '✨'
          },
          {
            title: 'Notification Settings',
            description: 'Choose when and how you want to be notified.',
            icon: '🔔'
          }
        ];
      };

      const handleStartOnboarding = () => {
        setShowOnboarding(true);
        setCurrentStep(0);
        setIsComplete(false);
      };

      const handleNext = () => {
        const steps = getSteps(selectedApp);
        if (currentStep < steps.length - 1) {
          setCurrentStep(currentStep + 1);
        } else {
          setIsComplete(true);
          setShowOnboarding(false);
        }
      };

      const handleBack = () => {
        if (currentStep > 0) {
          setCurrentStep(currentStep - 1);
        }
      };

      const handleSkip = () => {
        setShowOnboarding(false);
        setIsComplete(true);
      };

      const handleReset = () => {
        setCurrentStep(0);
        setIsComplete(false);
        setShowOnboarding(false);
      };

      if (showOnboarding) {
        const steps = getSteps(selectedApp);
        const step = steps[currentStep];
        const progress = ((currentStep + 1) / steps.length) * 100;

        return (
          <div style={{
            minHeight: '600px',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            background: 'var(--color-background)',
            borderRadius: '12px',
            padding: '24px'
          }}>
            <div style={{ width: '100%', maxWidth: '600px' }}>
              <div style={{ marginBottom: '32px' }}>
                <div style={{
                  height: '4px',
                  background: 'var(--color-border)',
                  borderRadius: '2px',
                  overflow: 'hidden',
                  marginBottom: '12px'
                }}>
                  <div style={{
                    height: '100%',
                    background: 'var(--color-primary)',
                    width: `${progress}%`,
                    transition: 'width 0.3s ease'
                  }}></div>
                </div>
                <div style={{
                  fontSize: '14px',
                  color: 'var(--color-text-secondary)',
                  textAlign: 'center'
                }}>
                  Step {currentStep + 1} of {steps.length}
                </div>
              </div>

              <div style={{
                background: 'var(--color-surface)',
                borderRadius: '16px',
                padding: '48px 32px',
                boxShadow: 'var(--shadow-md)',
                textAlign: 'center'
              }}>
                <div style={{ fontSize: '48px', marginBottom: '24px' }}>
                  {step.icon}
                </div>
                <h2 style={{
                  fontSize: '28px',
                  fontWeight: '700',
                  color: 'var(--color-text-primary)',
                  marginBottom: '12px'
                }}>
                  {step.title}
                </h2>
                <p style={{
                  fontSize: '16px',
                  lineHeight: '1.5',
                  color: 'var(--color-text-secondary)',
                  marginBottom: '32px'
                }}>
                  {step.description}
                </p>

                {currentStep === 2 && (
                  <div style={{
                    background: 'var(--color-background)',
                    padding: '20px',
                    borderRadius: '8px',
                    marginBottom: '32px',
                    textAlign: 'left'
                  }}>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)' }}>
                      ℹ️ This is where the notification settings component would appear,
                      allowing users to configure their preferences during onboarding.
                    </p>
                  </div>
                )}

                <div style={{
                  display: 'flex',
                  gap: '12px',
                  justifyContent: 'center',
                  marginBottom: '24px'
                }}>
                  {currentStep > 0 && (
                    <button
                      onClick={handleBack}
                      style={{
                        padding: '14px 32px',
                        fontSize: '16px',
                        fontWeight: '600',
                        borderRadius: '8px',
                        border: '1px solid var(--color-border)',
                        background: 'transparent',
                        color: 'var(--color-text-secondary)',
                        cursor: 'pointer',
                        minWidth: '120px'
                      }}
                    >
                      Back
                    </button>
                  )}
                  <button
                    onClick={handleNext}
                    style={{
                      padding: '14px 32px',
                      fontSize: '16px',
                      fontWeight: '600',
                      borderRadius: '8px',
                      border: 'none',
                      background: 'var(--color-primary)',
                      color: 'var(--color-text-on-primary)',
                      cursor: 'pointer',
                      minWidth: '120px'
                    }}
                  >
                    {currentStep === steps.length - 1 ? 'Get Started' : 'Continue'}
                  </button>
                </div>

                {currentStep < steps.length - 1 && (
                  <button
                    onClick={handleSkip}
                    style={{
                      background: 'transparent',
                      border: 'none',
                      color: 'var(--color-text-secondary)',
                      fontSize: '14px',
                      cursor: 'pointer',
                      textDecoration: 'underline'
                    }}
                  >
                    Skip onboarding
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      return (
        <>
          <div className="demo-controls">
            {apps.map(app => (
              <button
                key={app.id}
                className={`demo-button ${selectedApp === app.id ? 'demo-button--primary' : ''}`}
                onClick={() => setSelectedApp(app.id)}
              >
                {app.icon} {app.name}
              </button>
            ))}
          </div>

          <div className="demo-status">
            {isComplete ? (
              <span>✅ Onboarding completed for {apps.find(a => a.id === selectedApp).name}</span>
            ) : (
              <span>Ready to start onboarding for {apps.find(a => a.id === selectedApp).name}</span>
            )}
          </div>

          <div className="demo-app-view">
            <div style={{ fontSize: '64px', marginBottom: '24px' }}>
              {apps.find(a => a.id === selectedApp).icon}
            </div>
            <h2 style={{
              fontSize: '32px',
              fontWeight: '700',
              color: 'var(--color-text-primary)',
              marginBottom: '12px'
            }}>
              {apps.find(a => a.id === selectedApp).name}
            </h2>
            <p style={{
              fontSize: '16px',
              color: 'var(--color-text-secondary)',
              marginBottom: '32px'
            }}>
              {isComplete ? 'Welcome back! Your app is ready to use.' : 'First time here? Let\'s get you started!'}
            </p>
            <div style={{ display: 'flex', gap: '12px', justifyContent: 'center' }}>
              <button className="demo-button demo-button--primary" onClick={handleStartOnboarding}>
                {isComplete ? 'Restart Onboarding' : 'Start Onboarding'}
              </button>
              {isComplete && (
                <button className="demo-button" onClick={handleReset}>
                  Reset Status
                </button>
              )}
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OnboardingDemo />);
  </script>
</body>
</html>
